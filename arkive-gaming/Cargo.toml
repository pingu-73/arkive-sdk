[package]
name = "arkive-gaming"
version = "0.1.0"
edition = "2021"
description = "Modular gaming framework for ARKive SDK"
authors = ["Dikshant <dikshant.073@gmail.com>"]
license = "MIT OR Apache-2.0"
build = "./build.rs"

[dependencies]
arkive-core = { path = "../arkive-core" }

elements-miniscript = { git = "https://github.com/ElementsProject/elements-miniscript" }
elements = "0.25.0"

# Cryptography and Bitcoin
bitcoin = { workspace = true }
ark-core = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Async and utilities
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
rand = "0.8"

# Process execution for compiler
tokio-process = "0.2"
tempfile = { workspace = true }