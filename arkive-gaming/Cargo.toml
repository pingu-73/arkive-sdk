[package]
name = "arkive-gaming"
version = "0.1.0"
edition = "2021"
description = "Modular gaming framework for ARKive SDK"
authors = ["Dikshant <dikshant.073@gmail.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
arkive-core = { path = "../arkive-core" }

# Arkade Compiler Integration
arkade-compiler = { git = "https://github.com/arkade-os/compiler", rev = "44a80412c5102797a7654501d6aabb04ac89595b" }

# Cryptography and Bitcoin
bitcoin = { workspace = true }
ark-core = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Async and utilities
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
rand = "0.8"

# Process execution for compiler
tokio-process = "0.2"
tempfile = { workspace = true }