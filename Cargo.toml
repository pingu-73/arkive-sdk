[workspace]
members = ["arkive-core", "arkive-cli"]
resolver = "2"

[workspace.dependencies]
# Ark commit ver upgraded from c754d7adc8552b14d9d14ef871df271196089d8f (v0.6) to 37172878dca6c3d8cabb0d7a73bc36103ae733af (v0.7)
ark-client = { git = "https://github.com/pingu-73/ark-rs", rev = "17a856b1ddf34c5e8fb0eb2fce7ab36377f8802f" }
ark-core = { git = "https://github.com/pingu-73/ark-rs", rev = "17a856b1ddf34c5e8fb0eb2fce7ab36377f8802f" }
ark-bdk-wallet = { git = "https://github.com/pingu-73/ark-rs", rev = "17a856b1ddf34c5e8fb0eb2fce7ab36377f8802f" }
ark-grpc = { git = "https://github.com/pingu-73/ark-rs", rev = "17a856b1ddf34c5e8fb0eb2fce7ab36377f8802f" }
musig = { package = "ark-secp256k1", git = "https://github.com/pingu-73/ark-rs", rev = "17a856b1ddf34c5e8fb0eb2fce7ab36377f8802f", features = ["serde", "rand"] }

# Bitcoin
bitcoin = { version = "0.32.6", features = ["rand"] }
bip39 = { version = "2.1.0", features = ["rand"] }

# Async and networking
tokio = { version = "1.28", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
esplora-client = "0.12.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Storage
rusqlite = { version = "0.35.0", features = ["bundled"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.17.0", features = ["v4"] }
hex = "0.4.3"
chrono = { version = "0.4.40", features = ["serde"] }
tracing = "0.1"
parking_lot = { version = "0.12", features = ["send_guard"] }
tracing-subscriber = "0.3.19"

# Encryption and hashing
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.21"

# CLI
clap = { version = "4.0", features = ["derive"] }
dialoguer = "0.11"

# Testing
async-trait = "0.1"
tempfile = "3.8"
tracing-test = "0.2"
tokio-test = "0.4"
futures = "0.3"
regex = "1.0"